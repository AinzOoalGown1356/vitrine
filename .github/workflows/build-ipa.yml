name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Spotify IPA from private GitHub release
        env:
          GH_TOKEN: ${{ secrets.IPA_REPO_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p ipa

          gh release download v1 \
            --repo AinzOoalGown1356/spotify-ipa-transfer \
            --pattern "*.ipa" \
            --dir ipa

          IPA_FILE=$(find ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "::error::Spotify IPA was not downloaded"
            exit 1
          fi

          mv "$IPA_FILE" ipa/spotify.ipa

          unzip -tq ipa/spotify.ipa
          ls -lh ipa/spotify.ipa

      - name: Build Vitrine IPA
        run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"

          for f in out/*.ipa; do
            curl -fsS -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://filebin.net/$BIN/$(basename "$f")" >/dev/null

            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "- Download promptly; filebin storage is temporary." >> "$GITHUB_STEP_SUMMARY"
